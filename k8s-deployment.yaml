apiVersion: apps/v1
kind: Deployment
metadata:
  name: abc-retail-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abc-retail
  template:
    metadata:
      labels:
        app: abc-retail
    spec:
      containers:
      - name: abc-retail-container
        image: ananthkowlagi/abc-retail-mlops:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        - containerPort: 8501
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: abc-retail-service
spec:
  type: NodePort
  selector:
    app: abc-retail
  ports:
    - name: fastapi
      port: 8000
      targetPort: 8000
    - name: streamlit
      port: 8501
      targetPort: 8501
    - name: mlflow
      port: 5000
      targetPort: 5000
